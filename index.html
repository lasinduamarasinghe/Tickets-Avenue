<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tickets</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
:root{--bg:#eef1f4;--ink:#13233a;--mu:#5d6b7e;--ac:#f2a900;--card:#fff;--bd:#d5dbe3;--ok:#16794c;--no:#b3261e}
@media(prefers-color-scheme:dark){:root{--bg:#0e1724;--ink:#eaf0f7;--mu:#98a6b8;--card:#162235;--bd:#27384f;--ok:#4cc98d;--no:#ff7b72}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'DM Sans',system-ui,sans-serif}
h1,h2,h3{font-family:'Bricolage Grotesque','DM Sans',sans-serif;line-height:1.15;margin:.2em 0 .5em}
header{display:flex;gap:20px;align-items:center;padding:14px 5vw;border-bottom:2px dashed var(--bd)}
header b{font:800 22px 'Bricolage Grotesque',sans-serif;margin-right:auto}
a{color:inherit}main{max-width:1000px;margin:0 auto;padding:28px 5vw}footer{padding:24px 5vw;color:var(--mu);font-size:14px;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;text-decoration:none;display:block}
.card img,.hero{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:0}
.hero{border-radius:14px;margin-bottom:16px}
.p{padding:14px 16px;border-top:2px dashed var(--bd)}.p h3{margin:0 0 4px}
.mu{color:var(--mu)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin:16px 0}
input,select,textarea,button{font:inherit;width:100%;padding:11px 12px;margin:6px 0;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--ink)}
button{background:var(--ac);color:#13233a;border:0;font-weight:700;cursor:pointer;width:auto;padding:11px 20px}
button.s{background:transparent;border:1px solid var(--bd);color:var(--ink);padding:6px 12px;margin:2px}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tw{overflow-x:auto}.r{display:flex;gap:8px}.r>*{flex:1}
.tag{padding:2px 10px;border-radius:99px;font-size:13px;background:var(--bd);white-space:nowrap}
.approved,.good{color:var(--ok)}.rejected,.bad,.err{color:var(--no)}
#res{font:700 20px 'Bricolage Grotesque',sans-serif;text-align:center;padding:24px}
#res.good{border-color:var(--ok)}#res.bad{border-color:var(--no)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
</style></head><body>
<header><b>Tickets</b><a href="#/">Events</a><a href="#/find">My tickets</a></header>
<main id="app">Loading…</main>
<footer>Bank transfer payments are approved manually within 2–3 hours. · <a href="#/admin">Admin</a> · <a href="#/scan">Scanner</a></footer>
<script>
/* ====== EDIT THESE ====== */
const CFG={
  url:'https://szsgtvvhbokjwothhfts.supabase.co', key:'sb_publishable_pGkJrNZ1vNadjVRGszeJQA_yJndMHT1', cur:'LKR',
  bank:{name:'Your Bank',holder:'Account holder name',no:'0000000000',branch:'Branch name'}
};
/* ======================== */
const db=supabase.createClient(CFG.url,CFG.key),$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>CFG.cur+' '+Number(n).toLocaleString();
const when=d=>d?new Date(d).toLocaleString([],{dateStyle:'medium',timeStyle:'short'}):'';
const L={pending:'Waiting for payment',slip_uploaded:'Slip received – checking (2–3 hours)',approved:'Approved',rejected:'Rejected – please upload a new slip'};
const up=async(b,f)=>{const p=crypto.randomUUID()+'-'+f.name.replace(/[^\w.]/g,'_');const{error}=await db.storage.from(b).upload(p,f);if(error)throw error;return db.storage.from(b).getPublicUrl(p).data.publicUrl};
let scanner=null;
async function routes(){
  if(scanner){scanner.stop().catch(()=>{});scanner=null}
  const[,a,b,c]=location.hash.split('/');
  try{
    if(a==='e')await event(b);else if(a==='o')await order(b,decodeURIComponent(c||''));else if(a==='find')find();
    else if(a==='admin')await admin();else if(a==='scan')await scan();else await home();
  }catch(e){app.innerHTML=`<p class=err>${esc(e.message)}</p>`}
  scrollTo(0,0);
}
addEventListener('hashchange',routes);routes();

async function home(){
  const{data}=await db.from('events').select('*, ticket_types(price)').order('event_date');
  app.innerHTML=`<h1>What's on</h1><div class=grid>${(data||[]).map(e=>{const p=Math.min(...e.ticket_types.map(t=>t.price));
    return`<a class=card href="#/e/${e.id}">${e.image_url?`<img src="${esc(e.image_url)}" alt="">`:''}<div class=p><h3>${esc(e.title)}</h3><span class=mu>${when(e.event_date)}<br>${esc(e.venue)}${isFinite(p)?`<br>From ${money(p)}`:''}</span></div></a>`}).join('')||'<p>No events yet. Check back soon.</p>'}</div>`;
}

async function event(id){
  const{data:e,error}=await db.from('events').select('*').eq('id',id).single();if(error)throw error;
  const{data:t}=await db.rpc('types_left',{p_event:id});
  app.innerHTML=`${e.image_url?`<img class=hero src="${esc(e.image_url)}" alt="">`:''}<h1>${esc(e.title)}</h1>
  <p class=mu>${when(e.event_date)} · ${esc(e.venue)}</p><p style="white-space:pre-wrap">${esc(e.description)}</p>
  <div class=box><h3>Buy tickets</h3>
  <select id=ty>${(t||[]).map(x=>`<option value="${x.id}" data-p="${x.price}" ${x.remaining<1?'disabled':''}>${esc(x.name)} – ${money(x.price)} (${x.remaining<1?'sold out':x.remaining+' left'})</option>`).join('')}</select>
  <input id=qty type=number min=1 max=10 value=1 aria-label="Number of tickets">
  <input id=nm placeholder="Full name" autocomplete=name><input id=em type=email placeholder="Email" autocomplete=email><input id=ph placeholder="Phone" autocomplete=tel>
  <h2 id=tot></h2><button id=pay>Pay now</button></div>`;
  const upd=()=>{const o=$('#ty').selectedOptions[0];$('#tot').textContent='Total: '+money(o?o.dataset.p*Math.max(1,+$('#qty').value||1):0)};
  $('#ty').onchange=$('#qty').oninput=upd;upd();
  $('#pay').onclick=async()=>{
    const em=$('#em').value.trim();if(!$('#nm').value.trim()||!em)return alert('Please enter your name and email.');
    const{data,error}=await db.rpc('create_order',{p_type:$('#ty').value,p_qty:+$('#qty').value,p_name:$('#nm').value.trim(),p_email:em,p_phone:$('#ph').value.trim()});
    if(error)return alert(error.message);location.hash=`#/o/${data}/${encodeURIComponent(em)}`;
  };
}

async function order(ref,em){
  const{data:r}=await db.rpc('get_order',{p_ref:ref,p_email:em});
  if(!r)return app.innerHTML='<p>Reservation not found. Check the number and email.</p>';
  const{order:o,event:e,tickets:t}=r;
  let h=`<h1>Reservation ${esc(o.ref)}</h1><p>${esc(e.title)} · ${o.qty} ticket(s) · <b>${money(o.total)}</b></p><p>Status: <span class="tag ${o.status}">${L[o.status]}</span></p>`;
  if(o.status==='approved')h+=`<button id=dl>Download tickets (PDF)</button>`;
  else h+=`<div class=box><h3>Pay by bank transfer</h3><p>Transfer <b>${money(o.total)}</b> to:<br>${CFG.bank.name} · ${CFG.bank.holder}<br>Account <b>${CFG.bank.no}</b> (${CFG.bank.branch})</p>
  <p>Use this reference in the transfer: <b>${esc(o.ref)}</b></p><p class=mu>Then upload your bank slip (PDF or image). Bookmark this page to check your status.</p>
  <input type=file id=sl accept=".pdf,image/*"><button id=ub>Upload slip</button></div>`;
  app.innerHTML=h;
  if($('#dl'))$('#dl').onclick=()=>ticketPdf(e,o,t).catch(x=>alert(x.message));
  if($('#ub'))$('#ub').onclick=async()=>{const f=$('#sl').files[0];if(!f)return alert('Choose your slip first.');
    try{const url=await up('slips',f);const{error}=await db.rpc('attach_slip',{p_ref:ref,p_email:em,p_url:url});if(error)throw error;order(ref,em)}catch(x){alert(x.message)}};
}

function find(){
  app.innerHTML=`<h1>Find my tickets</h1><div class=box><input id=fr placeholder="Reservation number (TM-XXXXXX)"><input id=fe type=email placeholder="Email used at checkout"><button id=fb>Find</button></div>`;
  $('#fb').onclick=()=>location.hash=`#/o/${$('#fr').value.trim()}/${encodeURIComponent($('#fe').value.trim())}`;
}

/* ---- ticket PDF: your design as background + a unique QR per ticket ---- */
const qr=c=>{const d=document.createElement('div');new QRCode(d,{text:c,width:256,height:256,correctLevel:QRCode.CorrectLevel.M});return d.querySelector('canvas').toDataURL('image/png')};
const toData=async u=>{const b=await(await fetch(u)).blob();return new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})};
async function ticketPdf(e,o,codes){
  const{jsPDF}=window.jspdf,d=new jsPDF({orientation:'l',unit:'mm',format:[210,90]});
  const bg=e.design_url?await toData(e.design_url):null;
  codes.forEach((c,i)=>{
    if(i)d.addPage([210,90],'l');
    if(bg)d.addImage(bg,undefined,0,0,210,90);
    else{d.setFontSize(24);d.text(e.title,10,20,{maxWidth:150});d.setFontSize(12);d.text([when(e.event_date),e.venue||'',o.name+' – '+o.ref],10,40)}
    d.setFillColor(255,255,255);d.rect(168,46,38,42,'F');d.addImage(qr(c),'PNG',170,48,34,34);d.setFontSize(8);d.setTextColor(0);d.text(c,187,86,{align:'center'});
  });
  d.save(`tickets-${o.ref}.pdf`);
}

/* ---- staff login (admins + organizers) ---- */
async function login(){
  const{data:{session}}=await db.auth.getSession();
  if(session){const{data}=await db.from('admins').select('role').eq('user_id',session.user.id).maybeSingle();if(data)return data.role}
  app.innerHTML=`<div class=box style="max-width:380px;margin:auto"><h2>Staff login</h2><input id=le type=email placeholder=Email><input id=lp type=password placeholder=Password><button id=lb>Log in</button>${session?'<p class=err>This account is not set up as staff.</p>':''}</div>`;
  $('#lb').onclick=async()=>{const{error}=await db.auth.signInWithPassword({email:$('#le').value,password:$('#lp').value});error?alert(error.message):routes()};
  return null;
}
const logout=async()=>{await db.auth.signOut();location.hash='#/'};

async function admin(){
  const r=await login();if(!r)return;
  if(r!=='admin')return app.innerHTML='<p>This account can only use the <a href="#/scan">scanner</a>.</p>';
  const[{data:ev},{data:od}]=await Promise.all([db.from('events').select('*, ticket_types(*)').order('created_at',{ascending:false}),db.from('orders').select('*, events(title)').order('created_at',{ascending:false})]);
  app.innerHTML=`<div class=r><h1>Admin</h1><div style="text-align:right"><button class=s id=lo>Log out</button></div></div>
  <details class=box><summary><b>Create event</b></summary>
   <input id=t1 placeholder="Event title"><input id=vn placeholder="Venue"><input id=dt type=datetime-local><textarea id=ds rows=4 placeholder="Description"></textarea>
   <label class=mu>Event image</label><input id=im type=file accept="image/*">
   <label class=mu>Ticket design (optional) – landscape 210×90 mm image, keep the bottom-right corner empty for the QR code</label><input id=dg type=file accept="image/*">
   <h3>Ticket types</h3><div id=tts></div><button class=s id=add>+ Add ticket type</button><br><br><button id=sv>Save event</button></details>
  <h2>Orders</h2><div class=tw id=ad><table><tr><th>Ref<th>Customer<th>Event<th>Qty<th>Total<th>Status<th>Slip<th></tr>
  ${(od||[]).map(o=>`<tr><td>${esc(o.ref)}<td>${esc(o.name)}<br><span class=mu>${esc(o.email)}<br>${esc(o.phone)}</span><td>${esc(o.events?.title)}<td>${o.qty}<td>${money(o.total)}<td><span class="tag ${o.status}">${o.status}</span>
  <td>${o.slip_url?`<a href="${esc(o.slip_url)}" target=_blank rel=noopener>View</a>`:'–'}<td>${o.status==='approved'?'':`<button class=s data-a=ok data-id="${o.id}">Approve</button><button class=s data-a=no data-id="${o.id}">Reject</button>`}</tr>`).join('')}</table></div>
  <h2>Events</h2>${(ev||[]).map(e=>`<div class=box><b>${esc(e.title)}</b> <span class=mu>${when(e.event_date)} · ${e.ticket_types.map(t=>`${esc(t.name)} ${money(t.price)} ×${t.quantity}`).join(', ')}</span> <button class=s data-a=del data-id="${e.id}">Delete</button></div>`).join('')}`;
  $('#lo').onclick=logout;
  const row=()=>{const d=document.createElement('div');d.className='r tt';d.innerHTML='<input placeholder="Name (e.g. VIP)"><input type=number placeholder="Price"><input type=number placeholder="How many tickets">';$('#tts').append(d)};
  row();$('#add').onclick=row;
  $('#sv').onclick=async()=>{try{
    const f=x=>$('#'+x).files[0];
    const image_url=f('im')?await up('images',f('im')):null,design_url=f('dg')?await up('images',f('dg')):null;
    const{data:e,error}=await db.from('events').insert({title:$('#t1').value,venue:$('#vn').value,description:$('#ds').value,event_date:new Date($('#dt').value).toISOString(),image_url,design_url}).select().single();if(error)throw error;
    const rows=[...document.querySelectorAll('.tt')].map(r=>({event_id:e.id,name:r.children[0].value,price:+r.children[1].value,quantity:+r.children[2].value})).filter(x=>x.name&&x.quantity>0);
    const{error:e2}=await db.from('ticket_types').insert(rows);if(e2)throw e2;admin();
  }catch(x){alert(x.message)}};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=async()=>{
    const id=b.dataset.id,a=b.dataset.a;let res;
    if(a==='ok')res=await db.rpc('approve_order',{p_id:id});
    else if(a==='no')res=await db.from('orders').update({status:'rejected'}).eq('id',id);
    else if(confirm('Delete this event?'))res=await db.from('events').delete().eq('id',id);else return;
    res.error?alert(res.error.message):admin();
  });
}

async function scan(){
  if(!await login())return;
  app.innerHTML=`<div class=r><h1>Check-in</h1><div style="text-align:right"><button class=s id=lo>Log out</button></div></div><div id=rd></div><div id=res class=box>Point the camera at a ticket QR code</div>
  <input id=mc placeholder="Or type the ticket code"><button id=mb>Check</button>`;
  $('#lo').onclick=logout;
  const go=async c=>{const{data,error}=await db.rpc('check_in',{p_code:c});const o=error?{ok:false,msg:error.message}:data;$('#res').className='box '+(o.ok?'good':'bad');$('#res').textContent=o.msg;navigator.vibrate?.(o.ok?80:[80,60,80])};
  $('#mb').onclick=()=>go($('#mc').value);
  let last=0;scanner=new Html5Qrcode('rd');
  scanner.start({facingMode:'environment'},{fps:10,qrbox:240},c=>{if(Date.now()-last>2500){last=Date.now();go(c)}}).catch(e=>{$('#res').textContent='Camera unavailable: '+e});
}
</script></body></html>
